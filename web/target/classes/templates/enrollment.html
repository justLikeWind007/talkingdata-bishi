<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>高校选课管理系统</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin-bottom: 30px; padding: 15px; border: 1px solid #ddd; }
        .section h2 { margin-top: 0; }
        textarea { width: 100%; height: 120px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f5f5f5; }
        .message { padding: 10px; margin: 10px 0; background: #e8f5e9; }
        .error { background: #ffebee; }
        .tabs { margin-bottom: 10px; }
        .tab { padding: 5px 15px; margin-right: 5px; cursor: pointer; }
        .tab.active { background: #1976d2; color: white; }
    </style>
</head>
<body>
    <h1>高校选课管理系统</h1>

    <div class="section">
        <h2>数据导入</h2>
        <form method="post" action="/enrollment/import">
            <textarea name="csvData" placeholder="输入CSV格式数据，每行一条记录，格式：S000001,C000001,Java程序设计,专业课"></textarea>
            <br><br>
            <button type="submit">导入数据</button>
        </form>
    </div>

    <div class="section">
        <h2>数据检索</h2>
        <form method="get" action="/enrollment/search">
            <input type="text" name="keyword" th:value="${keyword}" placeholder="输入学生ID、课程ID、课程名称或课程类型" style="width: 300px;">
            <button type="submit">检索</button>
        </form>
    </div>

    <div th:if="${message}" class="message" th:classappend="${#strings.contains(message, '无匹配') ? 'error' : ''}" th:text="${message}"></div>

    <div class="section">
        <h2>选课数据</h2>
        <div class="tabs">
            <span class="tab active">全部</span>
        </div>
        <table>
            <thead>
                <tr>
                    <th>学生ID</th>
                    <th>课程ID</th>
                    <th>课程名称</th>
                    <th>课程类型</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="e : ${enrollments}">
                    <td th:text="${e.studentId}"></td>
                    <td th:text="${e.courseId}"></td>
                    <td th:text="${e.courseName}"></td>
                    <td th:text="${e.courseType}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(enrollments)}">
                    <td colspan="4">暂无数据，请先导入CSV数据</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="section" th:if="${not #maps.isEmpty(classified)}">
        <h2>按课程类型分类</h2>
        <div th:each="entry : ${classified}">
            <h3 th:text="${entry.key} + ' (' + ${#lists.size(entry.value)} + ')'"></h3>
            <table>
                <tr th:each="e : ${entry.value}">
                    <td th:text="${e.studentId}"></td>
                    <td th:text="${e.courseId}"></td>
                    <td th:text="${e.courseName}"></td>
                </tr>
            </table>
        </div>
    </div>
</body>
</html>
